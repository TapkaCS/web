<title>TapkaCraft Admin</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#07070b;color:#f3f4f9;font-family:sans-serif;}
  .box{text-align:center;}
  .box h1{font-size:1.4rem;margin-bottom:8px;}
  .box p{color:rgba(243,244,249,.64);font-size:.9rem;}
</style>
<div class="box">
  <h1>TapkaCraft Admin</h1>
  <p id="status">Opening login...</p>
</div>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  const identity = window.netlifyIdentity;
  const statusEl = document.getElementById('status');

  // The widget renders its modal into one of two internal iframes but
  // sometimes shows the OTHER (empty) one instead, so the form is present
  // in the DOM but invisible. Poll briefly after anything that could open
  // the widget and force the iframe that actually has content to be the
  // visible one. Happens for the plain login modal here and, on the main
  // site, for the auto-opened invite/recovery/confirmation modal too.
  function reconcileIdentityModal() {
    let ticks = 0;
    const interval = setInterval(() => {
      ticks += 1;
      document.querySelectorAll('iframe[title="Netlify identity widget"]').forEach((f) => {
        let hasContent = false;
        try {
          hasContent = !!(f.contentDocument && f.contentDocument.body && f.contentDocument.body.innerHTML.length > 0);
        } catch (e) { /* ignore */ }
        const isShown = getComputedStyle(f).display !== 'none';
        if (hasContent && !isShown) f.style.setProperty('display', 'block', 'important');
        if (!hasContent && isShown) f.style.setProperty('display', 'none', 'important');
      });
      if (ticks > 40) clearInterval(interval);
    }, 150);
  }

  identity.on('login', () => {
    statusEl.textContent = 'Logged in, redirecting...';
    setTimeout(() => { window.location.href = '/'; }, 300);
  });
  identity.on('init', (user) => {
    if (user) {
      window.location.href = '/';
    } else {
      // Calling open() synchronously inside the init callback races the
      // widget's own iframe setup and can leave the visible iframe empty
      // while the real login form renders into a hidden one. Deferring by
      // a tick avoids that.
      setTimeout(() => { identity.open('login'); reconcileIdentityModal(); }, 300);
    }
  });
  identity.init();
  reconcileIdentityModal();
</script>
